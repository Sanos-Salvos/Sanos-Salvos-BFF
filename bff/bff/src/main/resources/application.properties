server.port=8083
spring.application.name=sanosysalvos-bff

# CORS
spring.mvc.cors.allowed-origins=http://localhost:8080,http://localhost:3000
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*

# --- URLS de Microservicios ---
# Formato: http://${VARIABLE_ENTORNO:VALOR_POR_DEFECTO}/ruta

microservicio.organizaciones.url=http://${ORGANIZACIONES_HOST:localhost}:8081/api/organizaciones
microservicio.coincidencias.url=http://${COINCIDENCIAS_HOST:localhost}:8084/api/coincidencias
microservicio.pet.url=http://${PET_HOST:localhost}:8082/api/pet
microservicio.geolocalizacion.url=http://${GEOLOCALIZACION_HOST:localhost}:8085/api/geolocalizacion
microservicio.usuarios.url=http://${USUARIOS_HOST:localhost}:8087/api/users
microservicio.login.url=http://${LOGIN_HOST:localhost}:8089/api/login
microservicio.notificaciones.url=http://${NOTIFICACIONES_HOST:localhost}:8086/api/notifications
microservicio.auth.url=http://${AUTH_HOST:localhost}:8088/api/auth
server.port=8083
spring.application.name=sanosysalvos-bff

microservicio.organizaciones.url=http://${ORGANIZACIONES_HOST:localhost}:8081
microservicio.pet.url=http://${PET_HOST:localhost}:8082
microservicio.coincidencias.url=http://${COINCIDENCIAS_HOST:localhost}:8084
microservicio.geolocalizacion.url=http://${GEOLOCALIZACION_HOST:localhost}:8085
microservicio.notificaciones.url=http://${NOTIFICACIONES_HOST:localhost}:8086
microservicio.auth.url=http://${AUTH_HOST:localhost}:8088

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.com.sanosysalvos.bff.client=DEBUG
logging.level.feign=DEBUG

resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=15000
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3